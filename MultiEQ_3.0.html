<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi Equipment Launcher 3.0</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 16px 20px 40px;
      background: #fafafa;
      color: #1a1a1a;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .go-button {
      padding: 8px 16px;
      background-color: white;
      color: green;
      border: 2px solid green;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
    }
    .go-button:hover { background: #f0fff0; }
    .clear-button {
      padding: 6px 12px;
      background: white;
      color: #444;
      border: 1px solid #999;
      cursor: pointer;
      border-radius: 4px;
      font-size: 13px;
    }
    .clear-button:hover { background: #f5f5f5; }
    .selected-count {
      font-size: 13px;
      color: #555;
      min-width: 5.5em;
    }
    .itxe-toggle {
      font-size: 14px;
      user-select: none;
    }
    .columns {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 8px 18px;
      margin-top: 12px;
    }
    .group {
      display: inline-block;
      vertical-align: top;
      margin-top: 8px;
    }
    .group h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
    }
    .checkbox-label {
      display: block;
      font-weight: bold;
      margin: 4px 0;
      cursor: pointer;
    }
    input[type="checkbox"] {
      transform: scale(1.2);
      margin-left: 8px;
      accent-color: red;
    }
    td { vertical-align: top; }
    .search-wrap {
      margin: 0 0 10px 0;
    }
    #equipSearch {
      width: 200px;
      max-width: 100%;
      padding: 7px 10px;
      border: 2px solid #2a6fdb;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    #equipSearch:focus {
      box-shadow: 0 0 0 3px rgba(42, 111, 219, 0.2);
    }
    #equipSearch.match-ok {
      border-color: #1a7f37;
      background: #eaf8ee;
    }
    #equipSearch.match-bad {
      border-color: #c62828;
      background: #fdecea;
    }
    .checkbox-label.flash-match {
      outline: 2px solid #1a7f37;
      background: #d9f5e1;
      border-radius: 3px;
      transition: background 0.4s ease;
    }
    .search-hint {
      display: block;
      font-size: 11px;
      color: #777;
      margin-top: 4px;
    }
    .util-wide { width: 560px; }
    .itxr-wide { width: 280px; }

    .valid-section {
      margin-top: 8px;
      margin-left: 12px;
      padding: 12px 14px 14px;
      border: 2px solid #555;
      border-radius: 6px;
      background: #fff;
      align-self: flex-start;
    }
    .valid-section h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
    }
    .valid-boxes {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .valid-box {
      display: block;
      font-weight: bold;
      margin: 0;
      padding: 8px 12px;
      border: 1px solid #bbb;
      border-radius: 4px;
      background: #f7f7f7;
      cursor: pointer;
    }
    .valid-box:hover { background: #eee; }
    .valid-box.flash-match {
      outline: 2px solid #1a7f37;
      background: #d9f5e1;
    }
    .j2k-subhead {
      display: block;
      font-size: 11px;
      font-weight: bold;
      color: #666;
      margin: 10px 0 4px;
    }
  </style>
</head>

function equipmentCheckboxes() {
  return Array.from(document.querySelectorAll('input[type="checkbox"][data-id]'));
}

function updateSelectedCount() {
  const n = equipmentCheckboxes().filter(cb => cb.checked).length;
  document.getElementById('selectedCount').textContent = n + ' selected';
}

function clearAllSelections() {
  equipmentCheckboxes().forEach(cb => { cb.checked = false; });
  updateSelectedCount();
}

function normalizeQuery(s) {
  return String(s || '')
    .toLowerCase()
    .replace(/[_\-]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function scoreMatch(query, aliases, dataId, visibleLabel, groupName) {
  const q = normalizeQuery(query);
  if (!q) return -1;
  const candidates = new Set();
  (aliases || []).forEach(a => candidates.add(normalizeQuery(a)));
  candidates.add(normalizeQuery(visibleLabel));
  candidates.add(normalizeQuery(groupName + ' ' + visibleLabel));
  candidates.add(normalizeQuery(dataId.replace(/-/g, ' ')));

  let best = -1;
  for (const c of candidates) {
    if (!c) continue;
    if (c === q) best = Math.max(best, 100);
    else if (c.endsWith(' ' + q) || c.startsWith(q + ' ')) best = Math.max(best, 90);
    else if (c.includes(q)) best = Math.max(best, 70);
    else {
      // tolerant: strip common prefixes from query and retry
      const stripped = q
        .replace(/^(rx|tx)\s+/, '')
        .replace(/^(ird|j2k|stb|util\s+itxe|util\s+itxr|util|itxe|itxr|mediakind|mk|ateme|adtec)\s+/, '');
      if (stripped && stripped !== q) {
        if (c === stripped || c.endsWith(' ' + stripped) || /\b/.test(c) && c.split(' ').includes(stripped)) {
          best = Math.max(best, 85);
        } else if (c.includes(stripped)) {
          best = Math.max(best, 60);
        }
      }
    }
  }
  return best;
}

function findBestCheckbox(query) {
  let best = null;
  let bestScore = 0;
  equipmentCheckboxes().forEach(cb => {
    const label = cb.closest('label');
    const group = cb.closest('.group');
    const groupName = group ? (group.querySelector('h3')?.textContent || '') : '';
    const visible = label ? label.textContent.trim() : '';
    const aliases = (cb.getAttribute('data-aliases') || '').split(',').map(s => s.trim()).filter(Boolean);
    const score = scoreMatch(query, aliases, cb.getAttribute('data-id'), visible, groupName);
    if (score > bestScore) {
      bestScore = score;
      best = cb;
    }
  });
  return bestScore >= 60 ? best : null;
}

function flashSearch(ok) {
  const input = document.getElementById('equipSearch');
  input.classList.remove('match-ok', 'match-bad');
  void input.offsetWidth;
  input.classList.add(ok ? 'match-ok' : 'match-bad');
  setTimeout(() => input.classList.remove('match-ok', 'match-bad'), 450);
}

function flashLabel(cb) {
  const label = cb.closest('label');
  if (!label) return;
  label.classList.remove('flash-match');
  void label.offsetWidth;
  label.classList.add('flash-match');
  setTimeout(() => label.classList.remove('flash-match'), 700);
}

function selectFromSearch() {
  const input = document.getElementById('equipSearch');
  const q = input.value;
  const match = findBestCheckbox(q);
  if (match) {
    match.checked = true;
    flashLabel(match);
    flashSearch(true);
    updateSelectedCount();
    input.select();
  } else {
    flashSearch(false);
  }
  // keep focus for rapid multi-select
  input.focus();
}

document.getElementById('equipSearch').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    selectFromSearch();
  }
});

document.addEventListener('change', (e) => {
  if (e.target && e.target.matches && e.target.matches('input[type="checkbox"][data-id]')) {
    updateSelectedCount();
  }
});

function openSelectedIPs() {
  const order = ['j2k', 'mediakind', 'ateme', 'adtec', 'util', 'itxr', 'stb', 'valid'];
  const skipITXEs = document.getElementById('skipITXEs').checked;

  const selected = equipmentCheckboxes().filter(cb => cb.checked);

  const sorted = selected.sort((a, b) => {
    const [groupA, numA] = a.getAttribute('data-id').split('-');
    const [groupB, numB] = b.getAttribute('data-id').split('-');
    const groupOrderDiff = order.indexOf(groupA) - order.indexOf(groupB);
    return groupOrderDiff !== 0 ? groupOrderDiff : parseInt(numA, 10) - parseInt(numB, 10);
  });

  const tabsToOpen = [];

  sorted.forEach(cb => {
    const id = cb.getAttribute('data-id');
    const parts = id.split('-');
    const group = parts[0];
    const number = parts.slice(1).join('-');
    const ips = ipMap[id] || [];

    ips.forEach((ip, idx) => {
      if (skipITXEs) {
        // Attached ITXE is the 2nd+ URL on J2K/IRD rows only (not VALID reader+gen).
        const itxeGroups = ['j2k', 'mediakind', 'ateme', 'adtec'];
        if (ips.length > 1 && idx > 0 && itxeGroups.indexOf(group) !== -1) return;
        // Standalone UTIL/J2K ITXE-only rows (10.193) honor the same skip toggle as 2.0.
        if (ips.length === 1 && ip.indexOf('10.193') !== -1) return;
      }
      tabsToOpen.push({ ip: ip, number: number });
    });
  });

  tabsToOpen.reverse();

  tabsToOpen.forEach(entry => {
    const win = window.open(entry.ip, '_blank');
    if (entry.ip.indexOf('10.193') !== -1 && win) {
      win.onload = function() {
        win.document.title = 'X' + entry.number;
      };
    }
  });
}

updateSelectedCount();
